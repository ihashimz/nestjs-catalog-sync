apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: catalog
      role: postgres
  template:
    metadata:
      labels:
        app: catalog
        role: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: catalog-config
            - secretRef:
                name: catalog-secrets
          readinessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U $POSTGRES_USER -d $POSTGRES_DB']
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-postgres
spec:
  selector:
    app: catalog
    role: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-postgres-ingress
spec:
  podSelector:
    matchLabels:
      app: catalog
      role: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: catalog
            matchExpressions:
              - key: role
                operator: In
                values: [api, worker, migrate]
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: catalog
      role: redis
  template:
    metadata:
      labels:
        app: catalog
        role: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-redis
spec:
  selector:
    app: catalog
    role: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-redis-ingress
spec:
  podSelector:
    matchLabels:
      app: catalog
      role: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: catalog
            matchExpressions:
              - key: role
                operator: In
                values: [api, worker, migrate]
      ports:
        - protocol: TCP
          port: 6379
