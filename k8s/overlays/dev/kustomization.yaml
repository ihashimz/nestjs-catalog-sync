apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: catalog-dev
resources:
  - namespace.yaml
  - ../../base
  - dependencies.yaml
configMapGenerator:
  - name: catalog-config
    literals:
      - NODE_ENV=production
      - REDIS_HOST=catalog-redis
      - REDIS_PORT=6379
      - PORT=3000
      - WORKER_HEALTH_PORT=3001
      - SWAGGER_ENABLED=false
      - POSTGRES_USER=catalog
      - POSTGRES_DB=catalog
      - SUPPLIER_SOURCE=configured-supplier
secretGenerator:
  - name: catalog-secrets
    envs: [secrets.env]
